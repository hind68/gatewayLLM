spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8081
litellm.base-url=http://localhost:4000
litellm.master-key=${LITELLM_MASTER_KEY}
gateway.context.max-messages=${GATEWAY_CONTEXT_MAX_MESSAGES:20}
dlp.base-url=${DLP_BASE_URL:http://localhost:8000}
dlp.connect-timeout=${DLP_CONNECT_TIMEOUT:2s}
dlp.read-timeout=${DLP_READ_TIMEOUT:10s}
dlp.admin-key=${DLP_ADMIN_KEY:dev-dlp-admin}
keycloak.admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:http://127.0.0.1:8080}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:synapse}
keycloak.admin.token-realm=${KEYCLOAK_ADMIN_TOKEN_REALM:synapse}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:gateway-admin}
keycloak.admin.client-secret=${GATEWAY_ADMIN_CLIENT_SECRET:${KEYCLOAK_ADMIN_CLIENT_SECRET:}}
keycloak.admin.managed-roles=${KEYCLOAK_ADMIN_MANAGED_ROLES:ADMIN,INTERN,EXTERN}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/secure_llm_gateway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:secure_llm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://127.0.0.1:8080/realms/synapse}

dlp.patterns.file=${DLP_PATTERNS_FILE:../dlp/app/detectors/patterns.json}

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

app.attachments.storage-dir=${ATTACHMENTS_STORAGE_DIR:storage/attachments}
spring.servlet.multipart.max-file-size=${ATTACHMENTS_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ATTACHMENTS_MAX_REQUEST_SIZE:25MB}

